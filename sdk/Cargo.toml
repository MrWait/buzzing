[workspace]
resolver = "2"
members = [
"app-account",
"app-calendar",
"app-chat",
"app-common",
"app-ffi",
"app-network",
"app-office",
"app-todo",
"base-db",
"base-log",
"base-runtime",
"base-util",
"buzzing",
"buzzing-cli",
"proto",
"service",
]

[workspace.dependencies]
anyhow = "1"
bincode = "1.3"
bytes = "1.8"
dashmap = "6.1.0"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.38", features = ["full"]}
tokio-util = { version = "0.7", features = ["codec", "net"] }
tracing = "0.1.40"
tungstenite = "0.24"
tokio-tungstenite = "0.24"
once_cell = { version = "1", features = [ "parking_lot" ] }
# percent-encoding = "2.3"
reqwest = { version = "0.12.9", features = ["multipart", "json"] }
serde = { version = "1", features = ["serde_derive"] }
serde_json = { version = "1" }
rand = "0.8.5"
async-trait = "0.1"
# rusqlite = "0.32.0"
# rusqlite = { version ="0.32.0", features = ["bundled-sqlcipher-vendored-openssl"], target = "cfg(macos)" }
# rusqlite = { version ="0.32.0", features = ["bundled-sqlcipher-vendored-openssl"], target = "cfg(linux)" }
# rusqlite = { version ="0.32.0", features = ["bundled-sqlcipher"], target = "cfg(windows)" }
lazy_static = "*"
shadow-rs = "0.37.0"
tempfile = "=3.11.0"
libsimple = "0.3"
scopeguard = "1.2.0"
downcast-rs = "2.0.1"
parking_lot = { version = "0.12.3" }

prost-build-config = { path = "../tool/prost-build-config" }

app-account = { path = "./app-account" }
app-calendar = { path = "./app-calendar" }
app-chat = { path = "./app-chat" }
app-common = { path = "./app-common" }
app-ffi = { path = "./app-ffi" }
app-network = { path = "./app-network" }
app-office = { path = "./app-office" }
app-todo = { path = "./app-todo" }
base-db = { path = "./base-db" }
base-log = { path = "./base-log" }
base-runtime = { path = "./base-runtime" }
base-util = { path = "./base-util" }
proto = { path = "./proto" }
service = { path = "./service" }
