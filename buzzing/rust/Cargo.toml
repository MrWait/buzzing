[package]
name = "rust_lib_buzzing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
buzzing = { path = "../../sdk/buzzing" }
tracing = "0.1.40"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[package.metadata.cargokit]
# iOS 平台额外链接的框架
ios_frameworks = ["SystemConfiguration", "Security", "CFNetwork"]

# Android 平台额外链接的库
android_libraries = ["log", "z"]

# macOS 平台额外链接的框架
macos_frameworks = ["SystemConfiguration"]