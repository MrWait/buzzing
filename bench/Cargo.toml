[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
lazy_static = "*"
tokio = { version = "1.44.1", features = ["full"]}
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
bincode = "1.3"
bytes = "1.8"
log = "0.4"
prost = "0.13"
prost-types = "0.13"
rand = "0.8.5"
reqwest = { version = "0.12.9", features = ["multipart", "json"] }
percent-encoding = "2.3"
tracing = "0.1.40"
serde = { version = "1", features = ["serde_derive"] }
serde_json = { version = "1" }
tungstenite = "0.24"
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls"] }
async-trait = "0.1"
toml = "0.8"
parking_lot = { version = "0.12.3" }
rusqlite = { version ="0.32.0", features = [ "bundled" ] }
rustls = { version = "*", features = ["ring"] }

[build-dependencies]
prost-build = "0.13"
prost-build-config = { path = "../tool/prost-build-config" }
serde_yaml = "0.9.33"
shadow-rs = "0.37.0"