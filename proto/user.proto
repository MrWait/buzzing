syntax = "proto3";
package user;
option go_package = "./proto";
import "entity.proto";

message RegisterRequest {
    string mobile = 1;
    string password = 2;
    string name = 3;
}
message RegisterResponse {
    string access_token = 1;
    int64 access_expire = 2;
    int64 refresh_token = 3;
    repeated entity.User users = 4;
}

message JoinTenantRequest {

}
message JoinTenantResponse {

}

message CreateTenantRequest {

}
message CreateTenantResponse {

}

message CreateDepartmentRequest {

}
message CreateDepartMentResponse {

}

message LoginAccountRequest {
    string mobile = 1;
    string password = 2;
}
message LoginAccountResponse {
    string access_token = 1;
    int64 access_expire = 2;
    int64 refresh_token = 3;
    repeated entity.User users = 4;
}

message LoginWsRequest {
    int64 user_id = 1;
    string device_id = 2;
    string token = 3;
    string app_version = 4;
}
message LoginWsResponse {
    int64 id = 1;
    int64 account_id = 2;
    int64 tenant_id = 3;
    entity.User user = 4;
}

message RefreshTokenRequest {
    int64 user_id = 1;
}
message RefreshTokenResponse {
    string access_token = 1;
    int64 access_expire = 2;
    int64 refresh_token = 3;
    entity.User user = 4;
}

message GenerateTokenRequest {
    int64 userId = 1;
}
message GenerateTokenResponse {
    string accessToken = 1;
    int64 accessExpire = 2;
    int64 refreshAfter = 3;
}

message GetUserByIdsRequest {
    repeated int64 ids = 1;
}
message GetUserByIdsResponse {
    repeated entity.User users = 1;
}

// message LoginRequest {}
// message LoginResponse {}
// message LoginUserRequest {}
// message LoginUserResponse {}

message PushUserInfoRequest {
    repeated entity.User users = 1;
}
