syntax = "proto3";
package invite;
option go_package = "./proto";
import "entity.proto";

message InviteLink {
    int64 id = 1;
    int64 chat_id = 2;
    string chat_name = 3;
    string code = 4;
    int64 created_by = 5;
    int64 created_at = 6;
    int64 expires_at = 7;
    int32 max_uses = 8;
    int32 use_count = 9;
    bool is_active = 10;
}

message InviteLinkCreateRequest {
    int64 chat_id = 1;
    int64 expires_at = 2;
    int32 max_uses = 3;
}
message InviteLinkCreateResponse {
    string code = 1;
    string url = 2;
}

message InviteLinkJoinRequest {
    string code = 1;
}
message InviteLinkJoinResponse {
    int64 chat_id = 1;
    entity.Chat chat = 2;
}

message InviteLinkRevokeRequest {
    string code = 1;
}
message InviteLinkRevokeResponse {}
