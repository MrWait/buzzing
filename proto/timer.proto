syntax = "proto3";
package timer;

import "entity.proto";

message ScheduleMessageRequest {
    int64 chat_id = 1;
    int64 send_at_ms = 2;
    int32 tpy = 3;
    bytes content = 4;
    int64 client_id = 5;
    int64 at_user_id = 6;
    repeated int64 at_user_ids = 7;
}

message ScheduleMessageResponse {
    int64 schedule_id = 1;
    int64 schedule_at_ms = 2;
}

message CancelScheduleRequest {
    int64 schedule_id = 1;
}

message CancelScheduleResponse {}

message GetScheduledMessagesRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message GetScheduledMessagesResponse {
    repeated ScheduledMessage messages = 1;
    int32 total = 2;
}

message ScheduledMessage {
    int64 id = 1;
    int64 chat_id = 2;
    int64 send_at_ms = 3;
    int32 tpy = 4;
    bytes content = 5;
    int32 status = 6;
    int64 created_at_ms = 7;
}
