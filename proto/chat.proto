syntax = "proto3";
package chat;
option go_package = "./proto";
import "entity.proto";

// 会话实体变更推送（在线直推完整 chat 实体，见 data_sync §5）：载荷只携带 entity.chats
message PushChatUpdate {
    entity.Entity entity = 1;
}

message CreateChatRequest {
    entity.Chat chat = 1;
}

message CreateChatResponse {
    int64 chat_id = 1;
    entity.Entity entities = 2;
}

message GetChatByIdsRequest {
    repeated int64 ids = 1;
}

message GetChatByIdsResponse {
    entity.Entity entities = 1;
}

message SetChatDraftRequest {
    int64 chat_id = 1;
    bytes content = 2;
    int64 time_ms = 3;
}
message SetChatDraftResponse {}

message GetChatDraftRequest {
    int64 chat_id = 1;
}
message GetChatDraftResponse {
    int64 chat_id = 1;
    bytes content = 2;
    int64 time_ms = 3;
}

message DismissChatRequest {
    int64 chat_id = 1;
}
message DismissChatResponse {}

message UpdateChatRequest {
    int64 chat_id = 1;
    string name = 2;
    string avatar = 3;
    string description = 4;
    int64 owner_id = 5;
    repeated int64 admin_ids_add = 6;
    repeated int64 admin_ids_remove = 7;
    int32 join_mode = 8;
}
message UpdateChatResponse {
    entity.Entity entities = 1;
}

message SetAnnouncementRequest {
    int64 chat_id = 1;
    string title = 2;
    int32 tpy = 3;
    bytes body = 4;
    string summary = 5;
}
message SetAnnouncementResponse {
    entity.Entity entities = 1;
}

message DeleteAnnouncementRequest {
    int64 chat_id = 1;
}
message DeleteAnnouncementResponse {
    entity.Entity entities = 1;
}

message GetMembersRequest {
    int64 chat_id = 1;
    int32 page = 2;
    int32 page_size = 3;
    string keyword = 4;
}
message GetMembersResponse {
    repeated MemberItem members = 1;
    int32 total = 2;
}
message MemberItem {
    int64 user_id = 1;
    string name = 2;
    string avatar = 3;
    int32 role = 4;
}

message AddChatChatterRequest {
    int64 chat_id = 1;
    repeated int64 ids = 2;
}
message AddChatChatterResponse {}

message RemoveChatChatterRequest {
    int64 chat_id = 1;
    repeated int64 ids = 2;
}
message RemoveChatChatterResponse {}

message ReadChatMessageRequest {
    int64 chat_id = 1;
    int32 pos = 2;
    repeated int64 message_ids = 3;
}
message ReadChatMessageResponse {}

message QuitChatRequest {
    int64 chat_id = 1;
}
message QuitChatResponse {}
