syntax = "proto3";
package mute;
option go_package = "./proto";

message MuteMemberRequest {
    int64 chat_id = 1;
    int64 member_id = 2;
    int64 until_ms = 3;
}
message MuteMemberResponse {}

message GlobalMuteRequest {
    int64 chat_id = 1;
    int64 until_ms = 2;
}
message GlobalMuteResponse {}
