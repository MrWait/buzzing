syntax = "proto3";
package thread;
option go_package = "./proto";
import "entity.proto";

message GetThreadRequest {
    int64 chat_id = 1;
    int64 root_message_id = 2;
    int32 page = 3;
    int32 page_size = 4;
}
message GetThreadResponse {
    repeated entity.Message messages = 1;
    int32 total = 2;
}
